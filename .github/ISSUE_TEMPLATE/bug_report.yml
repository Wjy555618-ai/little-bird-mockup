name: 缺陷报告
description: 报告可以稳定复现的小鸟样机问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传客户文件、访问令牌、密码、付费信息或未授权素材。安全问题请使用私密漏洞报告入口。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本与构建指纹
      description: 例如 0.1.0 / REL-XXXXXXXXXXXX；开发构建请明确写 DEV。
    validations:
      required: true
  - type: dropdown
    id: figma-host
    attributes:
      label: Figma 运行环境
      options:
        - Figma Desktop - macOS
        - Figma Desktop - Windows
        - Figma Web
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: 操作系统与版本
      placeholder: 例如 macOS 15.1 / Windows 11 24H2
    validations:
      required: true
  - type: input
    id: asset
    attributes:
      label: 样机名称、assetId 与 revision
      description: 如果问题与具体样机无关，请写“不适用”。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 从打开插件开始，写出每一步操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有在公开 Issue 中附加秘密、客户文件、个人信息或未授权素材。
          required: true
