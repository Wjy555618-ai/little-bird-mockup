<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>样机工作室</title>
    <style>:root {
  color-scheme: dark;
  --bg: #111111;
  --panel: #171717;
  --panel-2: #1d1d1d;
  --panel-3: #242424;
  --line: #303030;
  --line-soft: #272727;
  --text: #f3f3f3;
  --muted: #999999;
  --muted-2: #676767;
  --accent: #d8ff5c;
  --accent-text: #111111;
  --purple: #9b73ff;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
}

* { box-sizing: border-box; }

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
}

button,
input,
select { font: inherit; }

button { color: inherit; }

.app-shell {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: 66px minmax(0, 1fr);
  background: #121212;
}

.topbar {
  min-width: 0;
  display: grid;
  grid-template-columns: 260px minmax(520px, 1fr) auto;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: #191919;
}

.brand,
.top-actions,
.mode-tabs,
.stage-toolbar > div,
.action-buttons,
.selection-chip,
.filter-row,
.asset-meta {
  display: flex;
  align-items: center;
}

.brand { gap: 10px; min-width: 0; }

.brand-mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  position: relative;
  transform: rotate(-12deg);
}

.brand-mark i {
  position: absolute;
  width: 22px;
  height: 9px;
  border-radius: 3px;
  background: linear-gradient(90deg, #f5f5f5, #b7b7b7);
  box-shadow: 0 1px 4px #0007;
}

.brand-mark i:nth-child(1) { transform: translateY(-6px); }
.brand-mark i:nth-child(2) { background: linear-gradient(90deg, #d8ff5c, #65e5b6); }
.brand-mark i:nth-child(3) { transform: translateY(6px); background: linear-gradient(90deg, #777, #efefef); }

.brand-name { font-weight: 650; font-size: 15px; white-space: nowrap; }

.version {
  padding: 3px 6px;
  border: 1px solid #3d3d3d;
  border-radius: 6px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .06em;
}

.mode-tabs { justify-content: center; min-width: 0; }

.mode-tab,
.rail-button,
.tool-button,
.icon-button,
.segment,
.profile-button,
.secondary-button,
.primary-button,
.screen-cta {
  border: 0;
  background: none;
  cursor: pointer;
}

.mode-tab {
  height: 42px;
  padding: 0 13px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #b9b9b9;
  white-space: nowrap;
  position: relative;
}

.mode-tab:hover { background: #222; color: #fff; }
.mode-tab.active { background: #262626; color: #fff; }
.mode-tab > span { font-size: 17px; color: #d8d8d8; }
.mode-tab i {
  position: absolute;
  top: 1px;
  right: 4px;
  color: var(--muted-2);
  font-size: 8px;
  font-style: normal;
  opacity: 0;
  transition: opacity .15s ease;
}
.mode-tab:hover i { opacity: 1; }

.mode-divider { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }

.top-actions { justify-content: flex-end; gap: 9px; }

.catalog-state {
  height: 30px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid #313131;
  border-radius: 99px;
  color: var(--muted);
  white-space: nowrap;
}

.catalog-state i,
.selection-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #5b5b5b;
}
.catalog-state.online i { background: #79db75; box-shadow: 0 0 10px #79db7566; }
.catalog-state.cached i { background: #e5ad5c; }
.catalog-state.error i { background: #e36f6f; }

.icon-button,
.profile-button,
.tool-button {
  height: 34px;
  min-width: 34px;
  border-radius: 10px;
  background: #252525;
  border: 1px solid #303030;
}
.icon-button:hover,
.tool-button:hover { background: #303030; }
.profile-button { padding: 0 13px; color: #d8d8d8; }

.workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: 64px 340px minmax(0, 1fr);
}

.rail {
  min-height: 0;
  padding: 16px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  border-right: 1px solid var(--line-soft);
  background: #151515;
}
.rail-spacer { flex: 1; }
.rail-button {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  color: #a8a8a8;
  font-size: 18px;
}
.rail-button:hover,
.rail-button.active { background: #272727; color: #fff; }

.catalog-panel {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr);
  border-right: 1px solid var(--line);
  background: #181818;
  position: relative;
}

.catalog-segments {
  height: 70px;
  margin: 0 14px;
  padding: 12px 4px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  border-bottom: 1px solid var(--line-soft);
}
.segment {
  border-radius: 14px;
  color: #c7c7c7;
}
.segment:hover { background: #202020; }
.segment.active { background: #292929; color: #fff; box-shadow: 0 2px 8px #0005; }

.catalog-tools { padding: 14px; border-bottom: 1px solid var(--line-soft); }
.search-field {
  height: 42px;
  display: grid;
  grid-template-columns: 26px 1fr 24px;
  align-items: center;
  gap: 4px;
  padding: 0 10px;
  border: 1px solid #353535;
  border-radius: 13px;
  background: #1b1b1b;
  color: var(--muted);
}
.search-field:focus-within { border-color: #616161; }
.search-field span { font-size: 20px; }
.search-field input {
  min-width: 0;
  border: 0;
  outline: 0;
  color: #eee;
  background: transparent;
}
.search-field input::placeholder { color: #777; }
.search-field button { border: 0; background: none; color: #777; cursor: pointer; font-size: 18px; }

.filter-row { justify-content: space-between; gap: 10px; margin-top: 12px; }
.category-select {
  flex: 1;
  height: 36px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #323232;
  border-radius: 11px;
  background: #1b1b1b;
}
.category-select select,
.fit-select select {
  flex: 1;
  border: 0;
  outline: 0;
  color: #d9d9d9;
  background: transparent;
}
.toggle-label { display: flex; align-items: center; gap: 7px; color: #929292; white-space: nowrap; cursor: pointer; }
.toggle-label input { display: none; }
.toggle {
  width: 32px;
  height: 18px;
  padding: 2px;
  border-radius: 99px;
  background: #3b3b3b;
  transition: background .15s ease;
}
.toggle::after {
  content: "";
  display: block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #8a8a8a;
  transition: transform .15s ease, background .15s ease;
}
.toggle-label input:checked + .toggle { background: var(--accent); }
.toggle-label input:checked + .toggle::after { transform: translateX(14px); background: #161616; }

.catalog-summary {
  height: 34px;
  padding: 0 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #707070;
  font-size: 11px;
}

.asset-grid {
  min-height: 0;
  overflow: auto;
  padding: 0 12px 18px;
  display: grid;
  align-content: start;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.asset-grid::-webkit-scrollbar { width: 7px; }
.asset-grid::-webkit-scrollbar-thumb { background: #383838; border-radius: 99px; }

.asset-card {
  min-width: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid transparent;
  border-radius: 14px;
  background: #232323;
  cursor: pointer;
  text-align: left;
  transition: border-color .15s ease, transform .15s ease;
}
.asset-card:hover { transform: translateY(-1px); border-color: #4a4a4a; }
.asset-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px #d8ff5c33; }
.asset-card img { width: 100%; aspect-ratio: 4 / 3; display: block; object-fit: cover; background: #2d2d2d; }
.asset-card footer { padding: 9px 10px 10px; display: grid; gap: 3px; }
.asset-card strong { overflow: hidden; color: #e8e8e8; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.asset-card span { color: #737373; font-size: 9px; }

.catalog-empty {
  position: absolute;
  inset: 230px 20px auto;
  display: grid;
  place-items: center;
  gap: 6px;
  color: #777;
  text-align: center;
}
.catalog-empty[hidden] { display: none; }
.catalog-empty strong { color: #aaa; }

.stage-panel {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: 54px minmax(0, 1fr) 72px;
  background: #202020;
}

.stage-toolbar {
  min-width: 0;
  padding: 0 16px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #2d2d2d;
  background: #1c1c1c;
}
.stage-toolbar > div { gap: 6px; }
.stage-toolbar > div:last-child { justify-content: flex-end; }
.tool-button { height: 30px; min-width: 30px; border-radius: 8px; }
.tool-button.active { background: #303030; color: #fff; }
.zoom-label { min-width: 32px; color: #808080; text-align: center; font-size: 11px; }

.selection-chip {
  height: 34px;
  min-width: 260px;
  max-width: 390px;
  gap: 8px;
  padding: 0 5px 0 11px;
  border: 1px solid #333;
  border-radius: 99px;
  background: #242424;
  color: #aaa;
}
.selection-chip.ready .selection-dot { background: var(--accent); box-shadow: 0 0 10px #d8ff5c55; }
.selection-chip > span:nth-child(2) { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selection-chip button {
  height: 26px;
  padding: 0 10px;
  border: 0;
  border-radius: 99px;
  background: #383838;
  color: #eee;
  cursor: pointer;
}
.selection-chip button:hover { background: #474747; }

.fit-select {
  height: 30px;
  padding: 0 9px;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid #343434;
  border-radius: 8px;
  color: #858585;
}

.stage {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
  padding: 26px;
  background:
    radial-gradient(circle at 50% 46%, #303030 0%, #252525 46%, #1d1d1d 100%);
}
.stage.light { background: radial-gradient(circle at 50% 46%, #e5e5e5 0%, #bdbdbd 60%, #999 100%); }

.canvas-wrap {
  max-width: 100%;
  max-height: 100%;
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 26px 70px #0008;
  transform-origin: center;
  transition: transform .18s ease;
}
.canvas-wrap canvas {
  width: 100%;
  height: 100%;
  max-width: calc(100vw - 470px);
  max-height: calc(100vh - 240px);
  display: block;
  object-fit: contain;
  background: #2a2a2a;
}
.screen-cta {
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  padding: 8px 13px 8px 8px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: 99px;
  background: #0e0e0edd;
  color: #f7f7f7;
  box-shadow: 0 12px 30px #0007;
}
.screen-cta:hover { background: #000; }
.screen-cta span {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #fff;
  color: #111;
  font-size: 19px;
}
.screen-cta.has-image { opacity: 0; }
.canvas-wrap:hover .screen-cta.has-image { opacity: 1; }

.rendering-badge {
  position: absolute;
  right: 14px;
  bottom: 14px;
  padding: 7px 10px;
  border-radius: 8px;
  background: #111d;
  color: #aaa;
  font-size: 11px;
}

.actionbar {
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border-top: 1px solid #2f2f2f;
  background: #1b1b1b;
}
.asset-meta { min-width: 0; flex-direction: column; align-items: flex-start; gap: 3px; }
.asset-meta strong { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asset-meta span { color: #777; font-size: 11px; }
.action-buttons { gap: 8px; }
.secondary-button,
.primary-button {
  height: 38px;
  padding: 0 17px;
  border-radius: 12px;
  font-weight: 600;
}
.secondary-button { background: #333; }
.secondary-button:hover { background: #414141; }
.primary-button { background: #f4f4f4; color: #111; }
.primary-button:hover { background: var(--accent); }
.secondary-button:disabled,
.primary-button:disabled { opacity: .35; cursor: not-allowed; }
.resolution-pill {
  height: 38px;
  padding: 0 13px;
  display: inline-flex;
  align-items: center;
  border-left: 1px solid #424242;
  color: #aaa;
  font-size: 11px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 88px;
  z-index: 20;
  transform: translateX(-50%);
  padding: 10px 14px;
  border: 1px solid #3b3b3b;
  border-radius: 10px;
  background: #141414ee;
  box-shadow: 0 12px 35px #0008;
  color: #ddd;
}
.toast[hidden] { display: none; }

@media (max-width: 980px) {
  .topbar { grid-template-columns: 190px 1fr auto; }
  .brand-name { display: none; }
  .mode-tab { padding: 0 8px; }
  .mode-tab > span { display: none; }
  .catalog-state { display: none; }
  .workspace { grid-template-columns: 54px 286px minmax(0, 1fr); }
  .stage-toolbar { grid-template-columns: auto 1fr auto; }
  .selection-chip { min-width: 0; }
  .canvas-wrap canvas { max-width: calc(100vw - 390px); }
}
</style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-name">样机工作室</span>
          <span class="version" id="versionLabel">DEV</span>
        </div>

        <nav class="mode-tabs" aria-label="样机模式">
          <button class="mode-tab active" data-mode="static"><span>▧</span>静态样机</button>
          <button class="mode-tab" data-mode="live"><span>✦</span>动态样机<i>开发中</i></button>
          <button class="mode-tab" data-mode="3d"><span>▱</span>3D 工作室<i>开发中</i></button>
          <span class="mode-divider"></span>
          <button class="mode-tab" data-mode="warp"><span>⌁</span>弯曲<i>规划中</i></button>
          <button class="mode-tab" data-mode="distort"><span>◇</span>透视变形<i>规划中</i></button>
        </nav>

        <div class="top-actions">
          <span class="catalog-state" id="catalogState"><i></i>连接素材库</span>
          <button class="icon-button" id="refreshButton" aria-label="刷新素材库" title="刷新素材库">↻</button>
          <button class="profile-button" aria-label="本地版本">本地版</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="rail" aria-label="功能栏">
          <button class="rail-button active" title="样机目录">▧</button>
          <button class="rail-button" id="settingsButton" title="设置">⌘</button>
          <div class="rail-spacer"></div>
          <button class="rail-button" id="aboutButton" title="关于">?</button>
        </aside>

        <aside class="catalog-panel">
          <div class="catalog-segments" role="tablist">
            <button class="segment active" data-filter="all">全部</button>
            <button class="segment" data-filter="packs">套装</button>
            <button class="segment" data-filter="recent">最近</button>
          </div>

          <div class="catalog-tools">
            <label class="search-field">
              <span>⌕</span>
              <input id="searchInput" type="search" placeholder="搜索样机" autocomplete="off" />
              <button id="clearSearch" aria-label="清空搜索">×</button>
            </label>
            <div class="filter-row">
              <label class="category-select">
                <span>☰</span>
                <select id="categorySelect" aria-label="样机分类">
                  <option value="all">全部分类</option>
                </select>
              </label>
              <label class="toggle-label">
                <input id="freeOnly" type="checkbox" />
                <span class="toggle"></span>
                仅免费
              </label>
            </div>
          </div>

          <div class="catalog-summary">
            <span id="catalogCount">0 个样机</span>
            <span id="catalogVersion">—</span>
          </div>

          <div class="asset-grid" id="assetGrid" aria-live="polite"></div>

          <div class="catalog-empty" id="catalogEmpty" hidden>
            <strong>没有找到样机</strong>
            <span>换个关键词或刷新素材库</span>
          </div>
        </aside>

        <section class="stage-panel">
          <div class="stage-toolbar">
            <div>
              <button class="tool-button active" title="适应画布">⌗</button>
              <button class="tool-button" id="zoomOut" title="缩小">−</button>
              <span class="zoom-label" id="zoomLabel">适应</span>
              <button class="tool-button" id="zoomIn" title="放大">＋</button>
            </div>
            <div class="selection-chip" id="selectionChip">
              <span class="selection-dot"></span>
              <span id="selectionText">未选择 Figma 图层</span>
              <button id="readSelectionButton">读取选区</button>
            </div>
            <div>
              <label class="fit-select">
                适配
                <select id="fitMode">
                  <option value="cover">填满</option>
                  <option value="contain">完整显示</option>
                  <option value="stretch">拉伸</option>
                </select>
              </label>
              <button class="tool-button" id="backgroundToggle" title="切换舞台背景">◐</button>
            </div>
          </div>

          <div class="stage" id="stage">
            <div class="canvas-wrap" id="canvasWrap">
              <canvas id="previewCanvas" width="1448" height="1086"></canvas>
              <button class="screen-cta" id="screenCta">
                <span>＋</span>
                选择 Figma 画面
              </button>
              <div class="rendering-badge" id="renderingBadge" hidden>正在渲染</div>
            </div>
          </div>

          <footer class="actionbar">
            <div class="asset-meta">
              <strong id="assetName">请选择样机</strong>
              <span id="assetMeta">等待素材目录</span>
            </div>
            <div class="action-buttons">
              <button class="secondary-button" id="downloadButton">导出 PNG</button>
              <button class="primary-button" id="pasteButton">粘贴到画布</button>
              <span class="resolution-pill">PNG · 原始尺寸</span>
            </div>
          </footer>
        </section>
      </main>

      <div class="toast" id="toast" role="status" hidden></div>
    </div>

    <script>const PLUGIN_VERSION = "0.1.0";
const DEVELOPMENT_CATALOG_URL = "http://localhost:4173/catalog/v1/manifest.json";
const PRODUCTION_CATALOG_URL = "https://assets.mockup-studio.example/catalog/v1/manifest.json";
const ACTIVE_CATALOG_URL = DEVELOPMENT_CATALOG_URL;
const CATALOG_CACHE_KEY = "mockup-studio-catalog-v1";
const RECENT_KEY = "mockup-studio-recent-v1";
const memoryStorage = new Map();

const safeStorage = {
  getItem(key) {
    try {
      return window.localStorage.getItem(key);
    } catch {
      return memoryStorage.get(key) || null;
    }
  },
  setItem(key, value) {
    memoryStorage.set(key, value);
    try {
      window.localStorage.setItem(key, value);
    } catch {
      // Figma plugin UIs run inside a data: URL where localStorage is disabled.
    }
  },
  removeItem(key) {
    memoryStorage.delete(key);
    try {
      window.localStorage.removeItem(key);
    } catch {
      // Keep the in-memory fallback only.
    }
  }
};

const elements = {
  versionLabel: document.querySelector("#versionLabel"),
  catalogState: document.querySelector("#catalogState"),
  refreshButton: document.querySelector("#refreshButton"),
  searchInput: document.querySelector("#searchInput"),
  clearSearch: document.querySelector("#clearSearch"),
  categorySelect: document.querySelector("#categorySelect"),
  freeOnly: document.querySelector("#freeOnly"),
  catalogCount: document.querySelector("#catalogCount"),
  catalogVersion: document.querySelector("#catalogVersion"),
  assetGrid: document.querySelector("#assetGrid"),
  catalogEmpty: document.querySelector("#catalogEmpty"),
  selectionChip: document.querySelector("#selectionChip"),
  selectionText: document.querySelector("#selectionText"),
  readSelectionButton: document.querySelector("#readSelectionButton"),
  fitMode: document.querySelector("#fitMode"),
  backgroundToggle: document.querySelector("#backgroundToggle"),
  stage: document.querySelector("#stage"),
  canvasWrap: document.querySelector("#canvasWrap"),
  previewCanvas: document.querySelector("#previewCanvas"),
  screenCta: document.querySelector("#screenCta"),
  renderingBadge: document.querySelector("#renderingBadge"),
  assetName: document.querySelector("#assetName"),
  assetMeta: document.querySelector("#assetMeta"),
  downloadButton: document.querySelector("#downloadButton"),
  pasteButton: document.querySelector("#pasteButton"),
  zoomOut: document.querySelector("#zoomOut"),
  zoomIn: document.querySelector("#zoomIn"),
  zoomLabel: document.querySelector("#zoomLabel"),
  toast: document.querySelector("#toast")
};

const state = {
  manifest: null,
  catalogBaseUrl: ACTIVE_CATALOG_URL,
  catalogMode: "loading",
  selectedAsset: null,
  baseImage: null,
  designImage: null,
  designObjectUrl: null,
  selection: null,
  segment: "all",
  zoom: 1,
  rendering: false,
  pluginCatalogCache: null
};

elements.versionLabel.textContent = `v${PLUGIN_VERSION}`;

function postPluginMessage(message) {
  if (window.parent === window) {
    handlePreviewBridge(message);
    return;
  }
  parent.postMessage({ pluginMessage: message }, "*");
}

function dispatchPreviewMessage(pluginMessage) {
  window.dispatchEvent(new MessageEvent("message", { data: { pluginMessage } }));
}

async function previewDesignBytes() {
  const canvas = document.createElement("canvas");
  canvas.width = 1600;
  canvas.height = 1000;
  const context = canvas.getContext("2d");
  const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
  gradient.addColorStop(0, "#080b28");
  gradient.addColorStop(0.55, "#3b168d");
  gradient.addColorStop(1, "#6c4dff");
  context.fillStyle = gradient;
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = "#ffffff0c";
  for (let x = 70; x < canvas.width; x += 150) {
    for (let y = 70; y < canvas.height; y += 150) {
      context.beginPath();
      context.roundRect(x, y, 116, 116, 22);
      context.fill();
    }
  }
  context.fillStyle = "#d8ff5c";
  context.fillRect(80, 790, 310, 12);
  context.fillStyle = "white";
  context.font = "600 68px Inter, sans-serif";
  context.fillText("Selected design", 80, 900);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  return new Uint8Array(await blob.arrayBuffer());
}

function handlePreviewBridge(message) {
  if (message.type === "ready") {
    setTimeout(() => dispatchPreviewMessage({
      type: "selection-state",
      pluginVersion: PLUGIN_VERSION,
      selection: {
        available: true,
        count: 1,
        name: "首页设计稿",
        nodeType: "FRAME",
        width: 1600,
        height: 1000,
        message: "已选择：首页设计稿（预览模拟）"
      }
    }), 30);
  }
  if (message.type === "request-selection") {
    previewDesignBytes().then((bytes) => dispatchPreviewMessage({
      type: "selection-image",
      bytes,
      name: "首页设计稿（预览模拟）"
    }));
  }
  if (message.type === "paste-render") {
    setTimeout(() => dispatchPreviewMessage({ type: "paste-complete", nodeId: "preview-node" }), 80);
  }
}

function setCatalogState(mode, label) {
  state.catalogMode = mode;
  elements.catalogState.className = `catalog-state ${mode}`;
  elements.catalogState.lastChild.textContent = label;
}

let toastTimer;
function showToast(message, duration = 2600) {
  clearTimeout(toastTimer);
  elements.toast.textContent = message;
  elements.toast.hidden = false;
  toastTimer = setTimeout(() => { elements.toast.hidden = true; }, duration);
}

function withTimeout(promise, milliseconds) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("请求超时")), milliseconds))
  ]);
}

function validateManifest(manifest) {
  if (!manifest || manifest.schemaVersion !== 1) throw new Error("不支持的素材清单版本");
  if (!Array.isArray(manifest.items)) throw new Error("素材清单缺少 items");
  for (const item of manifest.items) {
    if (!item.id || !item.name || item.renderer !== "static-screen-v1") {
      throw new Error(`样机条目不完整：${item.id || "unknown"}`);
    }
    if (!item.canvas || !Number.isFinite(item.canvas.width) || !Number.isFinite(item.canvas.height)) {
      throw new Error(`样机画布尺寸无效：${item.id}`);
    }
    if (!item.screen || !Array.isArray(item.screen.quad) || item.screen.quad.length !== 4) {
      throw new Error(`样机屏幕坐标无效：${item.id}`);
    }
    if (!item.layers || !item.layers.base || !item.thumbnail) {
      throw new Error(`样机资源路径无效：${item.id}`);
    }
  }
  return manifest;
}

function resolveAssetUrl(relativePath) {
  return new URL(relativePath, state.catalogBaseUrl).href;
}

async function fetchCatalog() {
  setCatalogState("loading", "连接素材库");
  try {
    const response = await withTimeout(fetch(ACTIVE_CATALOG_URL, { cache: "no-store" }), 4500);
    if (!response.ok) throw new Error(`素材库返回 ${response.status}`);
    const manifest = validateManifest(await response.json());
    state.manifest = manifest;
    state.catalogBaseUrl = ACTIVE_CATALOG_URL;
    const cache = {
      manifest,
      catalogBaseUrl: state.catalogBaseUrl,
      cachedAt: new Date().toISOString()
    };
    safeStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify(cache));
    postPluginMessage({ type: "cache-catalog", cache });
    setCatalogState("online", "素材库已同步");
    hydrateCatalog();
    return;
  } catch (error) {
    const cached = state.pluginCatalogCache || safeStorage.getItem(CATALOG_CACHE_KEY);
    if (cached) {
      try {
        const value = typeof cached === "string" ? JSON.parse(cached) : cached;
        state.manifest = validateManifest(value.manifest);
        state.catalogBaseUrl = value.catalogBaseUrl;
        setCatalogState("cached", "使用离线目录");
        hydrateCatalog();
        showToast("素材库暂时无法连接，已使用上次成功目录");
        return;
      } catch {
        safeStorage.removeItem(CATALOG_CACHE_KEY);
      }
    }
    setCatalogState("error", "素材库不可用");
    elements.catalogEmpty.hidden = false;
    elements.catalogEmpty.querySelector("strong").textContent = "素材服务尚未启动";
    elements.catalogEmpty.querySelector("span").textContent = "本地开发请运行 pnpm catalog";
    showToast(error instanceof Error ? error.message : "素材库加载失败");
  }
}

function hydrateCatalog() {
  const categories = state.manifest.categories || [];
  elements.categorySelect.innerHTML = '<option value="all">全部分类</option>';
  for (const category of categories) {
    const option = document.createElement("option");
    option.value = category.id;
    option.textContent = category.label;
    elements.categorySelect.appendChild(option);
  }
  elements.catalogVersion.textContent = state.manifest.catalogVersion;
  renderAssetGrid();
  if (!state.selectedAsset && state.manifest.items[0]) selectAsset(state.manifest.items[0].id);
}

function recentIds() {
  try {
    return JSON.parse(safeStorage.getItem(RECENT_KEY) || "[]");
  } catch {
    return [];
  }
}

function rememberRecent(id) {
  const next = [id, ...recentIds().filter((value) => value !== id)].slice(0, 12);
  safeStorage.setItem(RECENT_KEY, JSON.stringify(next));
}

function filteredItems() {
  if (!state.manifest) return [];
  const query = elements.searchInput.value.trim().toLocaleLowerCase("zh-CN");
  const category = elements.categorySelect.value;
  const onlyFree = elements.freeOnly.checked;
  const recent = new Set(recentIds());

  return state.manifest.items.filter((item) => {
    if (state.segment === "packs") return false;
    if (state.segment === "recent" && !recent.has(item.id)) return false;
    if (category !== "all" && item.category !== category) return false;
    if (onlyFree && !item.isFree) return false;
    if (query) {
      const haystack = [item.name, item.category, ...(item.tags || [])].join(" ").toLocaleLowerCase("zh-CN");
      if (!haystack.includes(query)) return false;
    }
    return true;
  });
}

function renderAssetGrid() {
  const items = filteredItems();
  elements.assetGrid.replaceChildren();
  elements.catalogCount.textContent = `${items.length} 个样机`;
  elements.catalogEmpty.hidden = items.length !== 0;
  if (!items.length) {
    elements.catalogEmpty.querySelector("strong").textContent = state.segment === "packs" ? "套装即将开放" : "没有找到样机";
    elements.catalogEmpty.querySelector("span").textContent = state.segment === "packs" ? "当前版本先验证单个样机流程" : "换个关键词或分类试试";
  }

  for (const item of items) {
    const button = document.createElement("button");
    button.className = `asset-card${state.selectedAsset?.id === item.id ? " active" : ""}`;
    button.dataset.assetId = item.id;

    const image = document.createElement("img");
    image.alt = item.name;
    image.src = resolveAssetUrl(item.thumbnail);
    image.loading = "lazy";

    const footer = document.createElement("footer");
    const name = document.createElement("strong");
    name.textContent = item.name;
    const meta = document.createElement("span");
    meta.textContent = item.isFree ? "免费 · 静态" : "静态";
    footer.append(name, meta);
    button.append(image, footer);
    button.addEventListener("click", () => selectAsset(item.id));
    elements.assetGrid.appendChild(button);
  }
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.crossOrigin = "anonymous";
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("样机图片加载失败"));
    image.src = url;
  });
}

async function selectAsset(id) {
  const asset = state.manifest?.items.find((item) => item.id === id);
  if (!asset) return;
  state.selectedAsset = asset;
  rememberRecent(id);
  elements.fitMode.value = asset.screen.defaultFit || "cover";
  elements.assetName.textContent = asset.name;
  elements.assetMeta.textContent = `${asset.canvas.width} × ${asset.canvas.height} · ${asset.isFree ? "免费" : "素材库"}`;
  elements.downloadButton.disabled = true;
  elements.pasteButton.disabled = true;
  state.rendering = true;
  elements.renderingBadge.hidden = false;
  renderAssetGrid();

  try {
    state.baseImage = await loadImage(resolveAssetUrl(asset.layers.base));
    elements.previewCanvas.width = asset.canvas.width;
    elements.previewCanvas.height = asset.canvas.height;
    await renderComposite();
  } catch (error) {
    showToast(error instanceof Error ? error.message : "样机加载失败");
  } finally {
    state.rendering = false;
    elements.renderingBadge.hidden = true;
    elements.downloadButton.disabled = !state.baseImage;
    elements.pasteButton.disabled = !state.baseImage;
  }
}

function quadSize(quad) {
  const distance = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  return {
    width: (distance(quad[0], quad[1]) + distance(quad[3], quad[2])) / 2,
    height: (distance(quad[0], quad[3]) + distance(quad[1], quad[2])) / 2
  };
}

function bilinearPoint(quad, u, v) {
  const topX = quad[0][0] + (quad[1][0] - quad[0][0]) * u;
  const topY = quad[0][1] + (quad[1][1] - quad[0][1]) * u;
  const bottomX = quad[3][0] + (quad[2][0] - quad[3][0]) * u;
  const bottomY = quad[3][1] + (quad[2][1] - quad[3][1]) * u;
  return [topX + (bottomX - topX) * v, topY + (bottomY - topY) * v];
}

function drawMappedTriangle(context, image, source, destination) {
  const [s0, s1, s2] = source;
  const [d0, d1, d2] = destination;
  const denominator = s0[0] * (s1[1] - s2[1]) + s1[0] * (s2[1] - s0[1]) + s2[0] * (s0[1] - s1[1]);
  if (Math.abs(denominator) < 0.00001) return;

  const a = (d0[0] * (s1[1] - s2[1]) + d1[0] * (s2[1] - s0[1]) + d2[0] * (s0[1] - s1[1])) / denominator;
  const c = (d0[0] * (s2[0] - s1[0]) + d1[0] * (s0[0] - s2[0]) + d2[0] * (s1[0] - s0[0])) / denominator;
  const e = (d0[0] * (s1[0] * s2[1] - s2[0] * s1[1]) + d1[0] * (s2[0] * s0[1] - s0[0] * s2[1]) + d2[0] * (s0[0] * s1[1] - s1[0] * s0[1])) / denominator;
  const b = (d0[1] * (s1[1] - s2[1]) + d1[1] * (s2[1] - s0[1]) + d2[1] * (s0[1] - s1[1])) / denominator;
  const d = (d0[1] * (s2[0] - s1[0]) + d1[1] * (s0[0] - s2[0]) + d2[1] * (s1[0] - s0[0])) / denominator;
  const f = (d0[1] * (s1[0] * s2[1] - s2[0] * s1[1]) + d1[1] * (s2[0] * s0[1] - s0[0] * s2[1]) + d2[1] * (s0[0] * s1[1] - s1[0] * s0[1])) / denominator;

  context.save();
  context.beginPath();
  context.moveTo(d0[0], d0[1]);
  context.lineTo(d1[0], d1[1]);
  context.lineTo(d2[0], d2[1]);
  context.closePath();
  context.clip();
  context.setTransform(a, b, c, d, e, f);
  context.drawImage(image, 0, 0);
  context.restore();
}

function insetQuad(quad, sourceAspect, targetAspect) {
  let minU = 0;
  let maxU = 1;
  let minV = 0;
  let maxV = 1;
  if (sourceAspect > targetAspect) {
    const heightRatio = targetAspect / sourceAspect;
    minV = (1 - heightRatio) / 2;
    maxV = 1 - minV;
  } else {
    const widthRatio = sourceAspect / targetAspect;
    minU = (1 - widthRatio) / 2;
    maxU = 1 - minU;
  }
  return [
    bilinearPoint(quad, minU, minV),
    bilinearPoint(quad, maxU, minV),
    bilinearPoint(quad, maxU, maxV),
    bilinearPoint(quad, minU, maxV)
  ];
}

function fillQuad(context, quad, color) {
  context.save();
  context.fillStyle = color;
  context.beginPath();
  context.moveTo(quad[0][0], quad[0][1]);
  for (let index = 1; index < quad.length; index += 1) context.lineTo(quad[index][0], quad[index][1]);
  context.closePath();
  context.fill();
  context.restore();
}

function drawImageToQuad(context, image, originalQuad, fit) {
  const target = quadSize(originalQuad);
  const targetAspect = target.width / target.height;
  const sourceAspect = image.width / image.height;
  let quad = originalQuad;
  let sourceRect = { x: 0, y: 0, width: image.width, height: image.height };

  if (fit === "cover") {
    if (sourceAspect > targetAspect) {
      sourceRect.width = image.height * targetAspect;
      sourceRect.x = (image.width - sourceRect.width) / 2;
    } else {
      sourceRect.height = image.width / targetAspect;
      sourceRect.y = (image.height - sourceRect.height) / 2;
    }
  } else if (fit === "contain") {
    fillQuad(context, originalQuad, "#0d0d0d");
    quad = insetQuad(originalQuad, sourceAspect, targetAspect);
  }

  const columns = 18;
  const rows = 10;
  for (let row = 0; row < rows; row += 1) {
    for (let column = 0; column < columns; column += 1) {
      const u0 = column / columns;
      const u1 = (column + 1) / columns;
      const v0 = row / rows;
      const v1 = (row + 1) / rows;
      const sx0 = sourceRect.x + sourceRect.width * u0;
      const sx1 = sourceRect.x + sourceRect.width * u1;
      const sy0 = sourceRect.y + sourceRect.height * v0;
      const sy1 = sourceRect.y + sourceRect.height * v1;
      const d00 = bilinearPoint(quad, u0, v0);
      const d10 = bilinearPoint(quad, u1, v0);
      const d11 = bilinearPoint(quad, u1, v1);
      const d01 = bilinearPoint(quad, u0, v1);
      drawMappedTriangle(context, image, [[sx0, sy0], [sx1, sy0], [sx1, sy1]], [d00, d10, d11]);
      drawMappedTriangle(context, image, [[sx0, sy0], [sx1, sy1], [sx0, sy1]], [d00, d11, d01]);
    }
  }
}

async function renderComposite() {
  if (!state.selectedAsset || !state.baseImage) return;
  const canvas = elements.previewCanvas;
  const context = canvas.getContext("2d", { alpha: false });
  context.setTransform(1, 0, 0, 1, 0, 0);
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.drawImage(state.baseImage, 0, 0, canvas.width, canvas.height);
  if (state.designImage) {
    drawImageToQuad(context, state.designImage, state.selectedAsset.screen.quad, elements.fitMode.value);
    elements.screenCta.classList.add("has-image");
    elements.screenCta.lastChild.textContent = "重新读取选区";
  } else {
    elements.screenCta.classList.remove("has-image");
    elements.screenCta.lastChild.textContent = "选择 Figma 画面";
  }
}

function requestSelection() {
  if (!state.selection?.available) {
    showToast(state.selection?.message || "请先在 Figma 画布中选择一个图层");
    return;
  }
  elements.readSelectionButton.disabled = true;
  elements.readSelectionButton.textContent = "读取中";
  postPluginMessage({ type: "request-selection" });
}

function canvasBlob() {
  return new Promise((resolve, reject) => {
    elements.previewCanvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error("无法生成 PNG"));
    }, "image/png");
  });
}

async function downloadRender() {
  try {
    const blob = await canvasBlob();
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = `${state.selectedAsset?.id || "mockup"}.png`;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("PNG 已导出");
  } catch (error) {
    showToast(error instanceof Error ? error.message : "导出失败");
  }
}

async function pasteRender() {
  try {
    elements.pasteButton.disabled = true;
    elements.pasteButton.textContent = "正在粘贴";
    const blob = await canvasBlob();
    const bytes = new Uint8Array(await blob.arrayBuffer());
    postPluginMessage({
      type: "paste-render",
      bytes,
      width: elements.previewCanvas.width,
      height: elements.previewCanvas.height,
      name: `${state.selectedAsset?.name || "样机"} · 样机工作室`
    });
  } catch (error) {
    elements.pasteButton.disabled = false;
    elements.pasteButton.textContent = "粘贴到画布";
    showToast(error instanceof Error ? error.message : "粘贴失败");
  }
}

function updateZoom(delta) {
  state.zoom = Math.max(0.7, Math.min(1.5, state.zoom + delta));
  elements.canvasWrap.style.transform = `scale(${state.zoom})`;
  elements.zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
}

for (const tab of document.querySelectorAll(".mode-tab")) {
  tab.addEventListener("click", () => {
    if (tab.dataset.mode !== "static") {
      showToast(`${tab.textContent.replace(/开发中|规划中/g, "").trim()}尚未实现；当前只开放真实可用的静态样机`);
      return;
    }
    document.querySelectorAll(".mode-tab").forEach((item) => item.classList.toggle("active", item === tab));
  });
}

for (const segment of document.querySelectorAll(".segment")) {
  segment.addEventListener("click", () => {
    state.segment = segment.dataset.filter;
    document.querySelectorAll(".segment").forEach((item) => item.classList.toggle("active", item === segment));
    renderAssetGrid();
  });
}

elements.refreshButton.addEventListener("click", fetchCatalog);
elements.searchInput.addEventListener("input", renderAssetGrid);
elements.clearSearch.addEventListener("click", () => {
  elements.searchInput.value = "";
  elements.searchInput.focus();
  renderAssetGrid();
});
elements.categorySelect.addEventListener("change", renderAssetGrid);
elements.freeOnly.addEventListener("change", renderAssetGrid);
elements.fitMode.addEventListener("change", renderComposite);
elements.readSelectionButton.addEventListener("click", requestSelection);
elements.screenCta.addEventListener("click", requestSelection);
elements.downloadButton.addEventListener("click", downloadRender);
elements.pasteButton.addEventListener("click", pasteRender);
elements.backgroundToggle.addEventListener("click", () => elements.stage.classList.toggle("light"));
elements.zoomIn.addEventListener("click", () => updateZoom(0.1));
elements.zoomOut.addEventListener("click", () => updateZoom(-0.1));
document.querySelector("#settingsButton").addEventListener("click", () => showToast("设置将在远程素材链路验证后开放"));
document.querySelector("#aboutButton").addEventListener("click", () => showToast("样机工作室 · 自有素材与渲染引擎"));

window.onmessage = async (event) => {
  const message = event.data.pluginMessage;
  if (!message || typeof message.type !== "string") return;

  if (message.type === "selection-state") {
    state.selection = message.selection;
    elements.selectionText.textContent = message.selection.message;
    elements.selectionChip.classList.toggle("ready", Boolean(message.selection.available));
    elements.readSelectionButton.disabled = !message.selection.available;
    return;
  }

  if (message.type === "catalog-cache") {
    state.pluginCatalogCache = message.cache;
    if (!state.manifest && message.cache) {
      try {
        state.manifest = validateManifest(message.cache.manifest);
        state.catalogBaseUrl = message.cache.catalogBaseUrl;
        setCatalogState("cached", "使用离线目录");
        hydrateCatalog();
      } catch {
        state.pluginCatalogCache = null;
      }
    }
    return;
  }

  if (message.type === "selection-image") {
    elements.readSelectionButton.disabled = false;
    elements.readSelectionButton.textContent = "重新读取";
    if (state.designObjectUrl) URL.revokeObjectURL(state.designObjectUrl);
    state.designObjectUrl = URL.createObjectURL(new Blob([message.bytes], { type: "image/png" }));
    state.designImage = await loadImage(state.designObjectUrl);
    await renderComposite();
    showToast(`已放入：${message.name}`);
    return;
  }

  if (message.type === "selection-error") {
    elements.readSelectionButton.disabled = false;
    elements.readSelectionButton.textContent = "读取选区";
    showToast(message.message);
    return;
  }

  if (message.type === "paste-complete") {
    elements.pasteButton.disabled = false;
    elements.pasteButton.textContent = "粘贴到画布";
    showToast("样机已粘贴到 Figma 画布");
    return;
  }

  if (message.type === "paste-error") {
    elements.pasteButton.disabled = false;
    elements.pasteButton.textContent = "粘贴到画布";
    showToast(message.message);
  }
};

elements.downloadButton.disabled = true;
elements.pasteButton.disabled = true;
postPluginMessage({ type: "ready" });
fetchCatalog();

void PRODUCTION_CATALOG_URL;
</script>
  </body>
</html>
