<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>样机工作室</title>
    <style>:root {
  color-scheme: dark;
  --bg: #151515;
  --panel: #1b1b1b;
  --panel-2: #202020;
  --panel-3: #272727;
  --line: #303030;
  --line-soft: #292929;
  --text: #e2e1e6;
  --muted: #97969d;
  --muted-2: #6f6e74;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-size: 12px; }
button, input, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 1px solid #d7d6da; outline-offset: 2px; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }

.app-shell { width: 100%; height: 100%; display: grid; grid-template-rows: 58px minmax(0, 1fr); position: relative; background: var(--bg); }
.collapsed-bar { display: none; }

.modebar { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); background: #181818; }
.mode-tabs, .top-actions, .stage-tools-right, .zoom-controls, .action-buttons, .primary-group, .filter-row, .asset-meta, .collapsed-title { display: flex; align-items: center; }
.mode-tabs { min-width: 0; height: 100%; }
.mode-tab, .rail-button, .tool-button, .window-button, .segment, .secondary-button, .primary-button, .screen-cta, .color-button { border: 0; background: none; cursor: pointer; }
.mode-tab { height: 38px; padding: 0 11px; border-radius: 10px; display: inline-flex; align-items: center; gap: 7px; color: #b4b3b9; white-space: nowrap; }
.mode-tab:hover { color: #f1f0f4; }
.mode-tab.active { background: #252525; color: #f4f3f6; }
.mode-tab svg { width: 17px; height: 17px; }
.mode-divider { width: 1px; height: 24px; background: var(--line); margin: 0 7px; }
.top-actions { gap: 7px; }

.catalog-state { width: 34px; height: 34px; position: relative; display: grid; place-items: center; color: #b8b7bd; }
.catalog-state-label { display: none; }
.catalog-state i { width: 7px; height: 7px; position: absolute; top: 4px; right: 3px; border: 1px solid #181818; border-radius: 50%; background: #6a6a6f; }
.catalog-state.online i { background: #f3f3f3; }
.catalog-state.cached i { background: #ee8d32; }
.catalog-state.error i { background: #dc5c5c; }
.window-button, .tool-button, .color-button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: #bdbcc2; }
.window-button:hover, .tool-button:hover, .color-button:hover { background: #262626; color: #fff; }

.workspace { min-width: 0; min-height: 0; display: grid; grid-template-columns: 52px 304px minmax(0, 1fr); }
.rail { min-height: 0; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-right: 1px solid var(--line-soft); background: #171717; }
.rail-spacer { flex: 1; }
.rail-button { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: #8e8d93; }
.rail-button:hover, .rail-button.active { background: #262626; color: #e8e7eb; }

.catalog-panel { min-width: 0; min-height: 0; display: grid; grid-template-rows: 66px auto 28px minmax(0, 1fr) auto; border-right: 1px solid var(--line); background: #181818; position: relative; }
.catalog-segments { height: 66px; margin: 0 14px; padding: 12px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-bottom: 1px solid var(--line-soft); }
.segment { border-radius: 11px; color: #c2c1c7; font-size: 13px; }
.segment:hover { color: #fff; }
.segment.active { background: #252525; color: #f2f1f4; box-shadow: 0 2px 5px #0005; }
.catalog-tools { padding: 13px 14px 12px; border-bottom: 1px solid var(--line-soft); }
.search-field { height: 40px; display: grid; grid-template-columns: 22px 1fr 20px; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #333337; border-radius: 12px; background: #1a1a1a; color: #86858b; }
.search-field:focus-within { border-color: #626167; }
.search-field svg { width: 17px; height: 17px; }
.search-field input { min-width: 0; border: 0; outline: 0; color: #e5e4e8; background: transparent; }
.search-field input::placeholder { color: #747379; }
.search-field button, .recent-strip button { border: 0; background: none; color: #747379; cursor: pointer; font-size: 18px; }
.filter-row { justify-content: space-between; gap: 10px; margin-top: 10px; }
.category-select { min-width: 0; flex: 1; height: 36px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border: 1px solid #323236; border-radius: 10px; background: #1a1a1a; color: #a5a4aa; }
.category-select svg { width: 16px; height: 16px; }
.category-select select, .fit-select select { min-width: 0; flex: 1; border: 0; outline: 0; color: #d5d4d9; background: transparent; }
.toggle-label { display: flex; align-items: center; gap: 7px; color: #8e8d93; white-space: nowrap; cursor: pointer; }
.toggle-label input { display: none; }
.toggle { width: 30px; height: 18px; padding: 2px; border-radius: 99px; background: #37373a; transition: background .15s ease; }
.toggle::after { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: #77767c; transition: transform .15s ease, background .15s ease; }
.toggle-label input:checked + .toggle { background: #dddce0; }
.toggle-label input:checked + .toggle::after { transform: translateX(12px); background: #242424; }
.catalog-summary { height: 28px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; color: #69686e; font-size: 10px; }

.asset-grid { min-height: 0; overflow: auto; padding: 0 12px 12px; display: grid; align-content: start; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.asset-grid::-webkit-scrollbar { width: 6px; }
.asset-grid::-webkit-scrollbar-thumb { background: #36363a; border-radius: 99px; }
.asset-card { min-width: 0; padding: 0; overflow: hidden; position: relative; border: 1px solid transparent; border-radius: 12px; background: #232323; cursor: pointer; text-align: left; }
.asset-card:hover { border-color: #5b5a60; }
.asset-card.active { border-color: #e0dfe3; box-shadow: 0 0 0 1px #e0dfe344; }
.asset-card img { width: 100%; aspect-ratio: 4 / 3; display: block; object-fit: cover; background: #2d2d2d; }
.asset-card footer { position: absolute; inset: auto 0 0; padding: 18px 8px 7px; display: grid; gap: 2px; background: linear-gradient(transparent, #101010d9); opacity: 0; transition: opacity .15s ease; }
.asset-card:hover footer, .asset-card:focus-visible footer { opacity: 1; }
.asset-card strong { overflow: hidden; color: #f0eff2; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.asset-card span { display: none; }
.catalog-empty { position: absolute; inset: 230px 20px auto; display: grid; place-items: center; gap: 6px; color: #737278; text-align: center; }
.catalog-empty[hidden] { display: none; }
.catalog-empty strong { color: #aaa9af; }

.recent-strip { height: 112px; padding: 9px 12px 12px; border-top: 1px solid var(--line-soft); background: #171717; }
.recent-strip[hidden] { display: none; }
.recent-strip header { height: 22px; display: flex; align-items: center; justify-content: space-between; color: #86858b; }
.recent-strip header button { line-height: 1; }
.recent-strip > div { height: 68px; display: flex; gap: 8px; }
.recent-item { width: 82px; overflow: hidden; border: 1px solid #3b3a3f; border-radius: 10px; background: #202020; cursor: pointer; }
.recent-item.active { border-color: #dedde1; }
.recent-item img { width: 100%; height: 100%; display: block; object-fit: cover; }

.stage-panel { min-width: 0; min-height: 0; display: grid; grid-template-rows: 48px minmax(0, 1fr) 66px; background: #202020; }
.stage-toolbar { min-width: 0; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; border-bottom: 1px solid #2d2d2d; background: #1c1c1c; }
.stage-tools-right { gap: 7px; }
.zoom-controls { gap: 3px; }
.zoom-controls .tool-button { width: 30px; height: 30px; background: #242424; }
.zoom-label { min-width: 34px; color: #85848a; text-align: center; font-size: 10px; }
.selection-chip { width: 1px; height: 1px; overflow: hidden; position: absolute; left: -9999px; clip: rect(0 0 0 0); white-space: nowrap; }
.fit-select { height: 32px; min-width: 114px; padding: 0 8px; display: flex; align-items: center; gap: 5px; border: 1px solid #343438; border-radius: 8px; color: #77767c; }
.color-button { border: 1px solid #343438; }
.color-button i { width: 17px; height: 17px; display: block; border: 1px solid #57565c; border-radius: 50%; background: linear-gradient(90deg, #d2d2d2 50%, #151515 50%); }

.stage { min-width: 0; min-height: 0; overflow: hidden; display: grid; place-items: center; padding: 24px; background: #202020; }
.stage.light { background: #d3d3d3; }
.canvas-wrap { max-width: 100%; max-height: 100%; position: relative; overflow: hidden; border-radius: 15px; transform-origin: center; transition: transform .16s ease; }
.canvas-wrap canvas { width: 100%; height: 100%; max-width: calc(100vw - 420px); max-height: calc(100vh - 220px); display: block; object-fit: contain; background: #2b2b2b; }
.screen-cta { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); padding: 0; display: grid; place-items: center; color: #fff; }
.screen-cta span { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: #070707; box-shadow: 0 13px 25px #0005; font-size: 25px; font-weight: 300; }
.screen-cta b { display: none; }
.screen-cta.has-image { opacity: 0; }
.canvas-wrap:hover .screen-cta.has-image { opacity: 1; }
.rendering-badge { position: absolute; right: 12px; bottom: 12px; padding: 6px 9px; border-radius: 7px; background: #111d; color: #aaa9af; font-size: 10px; }

.actionbar { padding: 0 16px; display: grid; grid-template-columns: minmax(130px, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; border-top: 1px solid #2f2f2f; background: #1b1b1b; }
.asset-meta { min-width: 0; flex-direction: column; align-items: flex-start; gap: 2px; }
.asset-meta strong { max-width: 190px; overflow: hidden; color: #d7d6db; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.asset-meta span { color: #727177; font-size: 9px; }
.action-buttons { grid-column: 2; justify-content: center; gap: 7px; }
.secondary-button, .primary-button, .resolution-pill { height: 38px; display: inline-flex; align-items: center; justify-content: center; }
.secondary-button, .primary-button { padding: 0 17px; border-radius: 20px; font-weight: 500; }
.secondary-button { background: #353535; }
.secondary-button:hover { background: #414141; }
.primary-group { overflow: hidden; border-radius: 21px; background: #efeff1; }
.primary-button { border-radius: 0; background: #efeff1; color: #121212; }
.primary-button:hover { background: #fff; }
.secondary-button:disabled, .primary-button:disabled { opacity: .35; cursor: not-allowed; }
.resolution-pill { padding: 0 13px; border-left: 1px solid #c6c5ca; color: #2f2f32; font-size: 10px; }

.resize-grip { width: 17px; height: 17px; position: absolute; right: 0; bottom: 0; border: 0; background: linear-gradient(135deg, transparent 52%, #67666c 54% 60%, transparent 62% 70%, #67666c 72% 78%, transparent 80%); cursor: nwse-resize; opacity: .7; }
.toast { position: fixed; left: 50%; bottom: 78px; z-index: 20; transform: translateX(-50%); padding: 9px 12px; border: 1px solid #3a393e; border-radius: 8px; background: #121212f2; box-shadow: 0 10px 28px #0008; color: #dddce1; }
.toast[hidden] { display: none; }

.app-icon { width: 25px; height: 25px; display: grid; place-items: center; position: relative; transform: rotate(-10deg); }
.app-icon i { width: 19px; height: 7px; position: absolute; border-radius: 3px; background: #efeff0; }
.app-icon i:nth-child(1) { transform: translateY(-5px); background: #c7c7ca; }
.app-icon i:nth-child(2) { background: #8f8f94; }
.app-icon i:nth-child(3) { transform: translateY(5px); background: #eeeeef; }
html.is-collapsed body { background: #181818; }
html.is-collapsed .app-shell { display: none; }
html.is-collapsed .collapsed-bar { width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 9px 0 12px; background: #181818; }
html.is-collapsed .collapsed-bar[aria-hidden="true"] { visibility: visible; }
.collapsed-title { min-width: 0; gap: 8px; font-weight: 600; white-space: nowrap; }
.expand-button { width: auto; padding: 0 10px; display: flex; gap: 6px; }
.expand-button span { font-size: 11px; }

@media (max-width: 900px) {
  .mode-tab { padding: 0 8px; }
  .workspace { grid-template-columns: 48px 272px minmax(0, 1fr); }
  .canvas-wrap canvas { max-width: calc(100vw - 372px); }
  .asset-meta { display: none; }
  .actionbar { grid-template-columns: 1fr; }
  .action-buttons { grid-column: 1; }
}

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
</style>
  </head>
  <body>
    <div class="collapsed-bar" id="collapsedBar" aria-hidden="true">
      <div class="collapsed-title">
        <span class="app-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>样机工作室</span>
      </div>
      <button class="window-button expand-button" id="expandButton" aria-label="展开插件">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" /></svg>
        <span>展开</span>
      </button>
    </div>

    <div class="app-shell">
      <header class="modebar">
        <nav class="mode-tabs" aria-label="样机模式">
          <button class="mode-tab active" data-mode="static">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m6 16 4-4 3 3 2-2 3 3" /></svg>
            <span>静态</span>
          </button>
          <button class="mode-tab" data-mode="live">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" /><path d="M12 7v10M7 12h10" /></svg>
            <span>动态</span>
          </button>
          <button class="mode-tab" data-mode="3d">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="2" /><path d="M3 20h18M8 17l-1 3M16 17l1 3" /></svg>
            <span>3D 工作室</span>
          </button>
          <span class="mode-divider" aria-hidden="true"></span>
          <button class="mode-tab" data-mode="warp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c5 3 11-3 16 0M4 12c5 3 11-3 16 0M4 19c5 3 11-3 16 0M5 4c3 5-3 11 0 16M12 4c3 5-3 11 0 16M19 4c3 5-3 11 0 16" /></svg>
            <span>弯曲</span>
          </button>
          <button class="mode-tab" data-mode="distort">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 14-2 1 15-16 1Z" /><circle cx="5" cy="6" r="1" /><circle cx="19" cy="4" r="1" /><circle cx="20" cy="19" r="1" /><circle cx="4" cy="20" r="1" /></svg>
            <span>透视变形</span>
          </button>
        </nav>

        <div class="top-actions">
          <span class="catalog-state" id="catalogState" title="连接素材库" aria-label="连接素材库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" /></svg>
            <i></i><span class="catalog-state-label">连接素材库</span>
          </span>
          <button class="window-button" id="refreshButton" aria-label="刷新素材库" title="刷新素材库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5" /><path d="M18.5 10A7 7 0 0 0 6.2 6.4L4 11M5.5 14A7 7 0 0 0 17.8 17.6L20 13" /></svg>
          </button>
          <button class="window-button" id="collapseButton" aria-label="收起插件" title="收起插件">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
          <button class="window-button" id="menuButton" aria-label="更多" title="更多">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="rail" aria-label="功能栏">
          <button class="rail-button active" title="样机目录" aria-label="样机目录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="3" /><path d="m8 15 3-3 2 2 2-2 2 3" /></svg>
          </button>
          <button class="rail-button" id="settingsButton" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M12 4v16M19 4v16M3 8h4M10 15h4M17 10h4" /></svg>
          </button>
          <div class="rail-spacer"></div>
          <button class="rail-button" id="aboutButton" title="关于" aria-label="关于">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.8 9a2.4 2.4 0 1 1 3.6 2.1c-.9.5-1.4 1.1-1.4 2.2M12 17h.01" /></svg>
          </button>
        </aside>

        <aside class="catalog-panel">
          <div class="catalog-segments" role="tablist">
            <button class="segment active" data-filter="all">全部</button>
            <button class="segment" data-filter="packs">套装</button>
            <button class="segment" data-filter="similar">相似</button>
          </div>

          <div class="catalog-tools">
            <label class="search-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4 4" /></svg>
              <input id="searchInput" type="search" placeholder="搜索样机" autocomplete="off" />
              <button id="clearSearch" aria-label="清空搜索">×</button>
            </label>
            <div class="filter-row">
              <label class="category-select">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
                <select id="categorySelect" aria-label="样机分类">
                  <option value="all">全部分类</option>
                </select>
              </label>
              <label class="toggle-label">
                <input id="freeOnly" type="checkbox" />
                <span class="toggle"></span>
                仅免费
              </label>
            </div>
          </div>

          <div class="catalog-summary">
            <span id="catalogCount">0 个样机</span>
            <span id="catalogVersion">—</span>
          </div>

          <div class="asset-grid" id="assetGrid" aria-live="polite"></div>

          <div class="catalog-empty" id="catalogEmpty" hidden>
            <strong>没有找到样机</strong>
            <span>换个关键词或刷新素材库</span>
          </div>

          <section class="recent-strip" id="recentStrip" hidden>
            <header><span>最近使用</span><button id="clearRecent" aria-label="清除最近使用">×</button></header>
            <div id="recentItems"></div>
          </section>
        </aside>

        <section class="stage-panel">
          <div class="stage-toolbar">
            <button class="tool-button" id="fitStageButton" title="适应画布" aria-label="适应画布">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" /></svg>
            </button>
            <div class="stage-tools-right">
              <span class="zoom-controls">
                <button class="tool-button" id="zoomOut" title="缩小" aria-label="缩小">−</button>
                <span class="zoom-label" id="zoomLabel">适应</span>
                <button class="tool-button" id="zoomIn" title="放大" aria-label="放大">＋</button>
              </span>
              <label class="fit-select">
                <span>适配</span>
                <select id="fitMode">
                  <option value="cover">填满</option>
                  <option value="contain">完整显示</option>
                  <option value="stretch">拉伸</option>
                </select>
              </label>
              <button class="color-button" id="backgroundToggle" title="切换舞台背景" aria-label="切换舞台背景"><i></i></button>
            </div>

            <div class="selection-chip" id="selectionChip" aria-live="polite">
              <span class="selection-dot"></span>
              <span id="selectionText">未选择 Figma 图层</span>
              <button id="readSelectionButton">读取选区</button>
            </div>
          </div>

          <div class="stage" id="stage">
            <div class="canvas-wrap" id="canvasWrap">
              <canvas id="previewCanvas" width="1448" height="1086"></canvas>
              <button class="screen-cta" id="screenCta">
                <span>＋</span>
                <b>选择 Figma 画面</b>
              </button>
              <div class="rendering-badge" id="renderingBadge" hidden>正在渲染</div>
            </div>
          </div>

          <footer class="actionbar">
            <div class="asset-meta">
              <strong id="assetName">请选择样机</strong>
              <span id="assetMeta">等待素材目录</span>
            </div>
            <div class="action-buttons">
              <button class="secondary-button" id="downloadButton">导出</button>
              <div class="primary-group">
                <button class="primary-button" id="pasteButton">粘贴到画布</button>
                <span class="resolution-pill">平面 · 原始尺寸</span>
              </div>
            </div>
          </footer>
        </section>
      </main>

      <button class="resize-grip" id="resizeGrip" aria-label="调整窗口大小" title="拖动调整窗口大小"></button>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>

    <span id="versionLabel" hidden>DEV</span>
    <script>const PLUGIN_VERSION = "0.1.0";
const DEVELOPMENT_CATALOG_URL = "http://localhost:4173/catalog/v1/manifest.json";
const PRODUCTION_CATALOG_URL = "https://assets.mockup-studio.example/catalog/v1/manifest.json";
const ACTIVE_CATALOG_URL = DEVELOPMENT_CATALOG_URL;
const CATALOG_CACHE_KEY = "mockup-studio-catalog-v1";
const RECENT_KEY = "mockup-studio-recent-v1";
const memoryStorage = new Map();

const safeStorage = {
  getItem(key) {
    try {
      return window.localStorage.getItem(key);
    } catch {
      return memoryStorage.get(key) || null;
    }
  },
  setItem(key, value) {
    memoryStorage.set(key, value);
    try {
      window.localStorage.setItem(key, value);
    } catch {
      // Figma plugin UIs run inside a data: URL where localStorage is disabled.
    }
  },
  removeItem(key) {
    memoryStorage.delete(key);
    try {
      window.localStorage.removeItem(key);
    } catch {
      // Keep the in-memory fallback only.
    }
  }
};

  versionLabel: document.querySelector("#versionLabel"),
  catalogState: document.querySelector("#catalogState"),
  refreshButton: document.querySelector("#refreshButton"),
  searchInput: document.querySelector("#searchInput"),
  clearSearch: document.querySelector("#clearSearch"),

const state = {
  manifest: null,
  catalogBaseUrl: ACTIVE_CATALOG_URL,
  catalogMode: "loading",
  selectedAsset: null,
  baseImage: null,
  designImage: null,
  designObjectUrl: null,
  selection: null,
  segment: "all",
  zoom: 1,
  rendering: false,
  pluginCatalogCache: null
};

elements.versionLabel.textContent = `v${PLUGIN_VERSION}`;

function postPluginMessage(message) {
  if (window.parent === window) {
    handlePreviewBridge(message);
    return;
  }
  parent.postMessage({ pluginMessage: message }, "*");
}

function dispatchPreviewMessage(pluginMessage) {
  window.dispatchEvent(new MessageEvent("message", { data: { pluginMessage } }));
}

async function previewDesignBytes() {
  const canvas = document.createElement("canvas");
  canvas.width = 1600;
  canvas.height = 1000;
  const context = canvas.getContext("2d");
  const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
  gradient.addColorStop(0, "#101827");
  gradient.addColorStop(0.55, "#254d77");
  gradient.addColorStop(1, "#6d94bd");
  context.fillStyle = gradient;
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = "#ffffff0c";
  for (let x = 70; x < canvas.width; x += 150) {
    for (let y = 70; y < canvas.height; y += 150) {
      context.beginPath();
      context.roundRect(x, y, 116, 116, 22);
      context.fill();
    }
  }
  context.fillStyle = "#f2f2f2";
  context.fillRect(80, 790, 310, 12);
  context.fillStyle = "white";
  context.font = "600 68px Inter, sans-serif";
  context.fillText("Selected design", 80, 900);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  return new Uint8Array(await blob.arrayBuffer());
}

function handlePreviewBridge(message) {
  if (message.type === "ready") {
    setTimeout(() => dispatchPreviewMessage({
      type: "selection-state",
      pluginVersion: PLUGIN_VERSION,
      selection: {
        available: true,
        count: 1,
        name: "首页设计稿",
        nodeType: "FRAME",
        width: 1600,
        height: 1000,
        message: "已选择：首页设计稿（预览模拟）"
      }
    }), 30);
  }
  if (message.type === "request-selection") {
    previewDesignBytes().then((bytes) => dispatchPreviewMessage({
      type: "selection-image",
      bytes,
      name: "首页设计稿（预览模拟）"
    }));
  }
  if (message.type === "paste-render") {
    setTimeout(() => dispatchPreviewMessage({ type: "paste-complete", nodeId: "preview-node" }), 80);
  }
}

function setCatalogState(mode, label) {
  state.catalogMode = mode;
  elements.catalogState.className = `catalog-state ${mode}`;
  elements.catalogState.querySelector(".catalog-state-label").textContent = label;
  elements.catalogState.title = label;
  elements.catalogState.setAttribute("aria-label", label);
}

let toastTimer;
function showToast(message, duration = 2600) {
  clearTimeout(toastTimer);
  elements.toast.textContent = message;
  elements.toast.hidden = false;
  toastTimer = setTimeout(() => { elements.toast.hidden = true; }, duration);
}

function withTimeout(promise, milliseconds) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("请求超时")), milliseconds))
  ]);
}

function validateManifest(manifest) {
  if (!manifest || manifest.schemaVersion !== 1) throw new Error("不支持的素材清单版本");
  if (!Array.isArray(manifest.items)) throw new Error("素材清单缺少 items");
  for (const item of manifest.items) {
    if (!item.id || !item.name || item.renderer !== "static-screen-v1") {
      throw new Error(`样机条目不完整：${item.id || "unknown"}`);
    }
    if (!item.canvas || !Number.isFinite(item.canvas.width) || !Number.isFinite(item.canvas.height)) {
      throw new Error(`样机画布尺寸无效：${item.id}`);
    }
    if (!item.screen || !Array.isArray(item.screen.quad) || item.screen.quad.length !== 4) {
      throw new Error(`样机屏幕坐标无效：${item.id}`);
    }
    if (!item.layers || !item.layers.base || !item.thumbnail) {
      throw new Error(`样机资源路径无效：${item.id}`);
    }
  }
  return manifest;
}

function resolveAssetUrl(relativePath) {
  return new URL(relativePath, state.catalogBaseUrl).href;
}

async function fetchCatalog() {
  setCatalogState("loading", "连接素材库");
  try {
    const response = await withTimeout(fetch(ACTIVE_CATALOG_URL, { cache: "no-store" }), 4500);
    if (!response.ok) throw new Error(`素材库返回 ${response.status}`);
    const manifest = validateManifest(await response.json());
    state.manifest = manifest;
    state.catalogBaseUrl = ACTIVE_CATALOG_URL;
    const cache = {
      manifest,
      catalogBaseUrl: state.catalogBaseUrl,
      cachedAt: new Date().toISOString()
    };
    safeStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify(cache));
    postPluginMessage({ type: "cache-catalog", cache });
    setCatalogState("online", "素材库已同步");
    hydrateCatalog();
    return;
  } catch (error) {
    const cached = state.pluginCatalogCache || safeStorage.getItem(CATALOG_CACHE_KEY);
    if (cached) {
      try {
        const value = typeof cached === "string" ? JSON.parse(cached) : cached;
        state.manifest = validateManifest(value.manifest);
        state.catalogBaseUrl = value.catalogBaseUrl;
        setCatalogState("cached", "使用离线目录");
        hydrateCatalog();
        showToast("素材库暂时无法连接，已使用上次成功目录");
        return;
      } catch {
        safeStorage.removeItem(CATALOG_CACHE_KEY);
      }
    }
    setCatalogState("error", "素材库不可用");
    elements.catalogEmpty.hidden = false;
    elements.catalogEmpty.querySelector("strong").textContent = "素材服务尚未启动";
    elements.catalogEmpty.querySelector("span").textContent = "本地开发请运行 pnpm catalog";
    showToast(error instanceof Error ? error.message : "素材库加载失败");
  }
}

function hydrateCatalog() {
  const categories = state.manifest.categories || [];
  elements.categorySelect.innerHTML = '<option value="all">全部分类</option>';
  for (const category of categories) {
    const option = document.createElement("option");
    option.value = category.id;
    option.textContent = category.label;
    elements.categorySelect.appendChild(option);
  }
  elements.catalogVersion.textContent = state.manifest.catalogVersion;
  renderAssetGrid();
  if (!state.selectedAsset && state.manifest.items[0]) selectAsset(state.manifest.items[0].id);
}

function recentIds() {
  try {
    return JSON.parse(safeStorage.getItem(RECENT_KEY) || "[]");
  } catch {
    return [];
  }
}

function rememberRecent(id) {
  const next = [id, ...recentIds().filter((value) => value !== id)].slice(0, 12);
  safeStorage.setItem(RECENT_KEY, JSON.stringify(next));
}

function renderRecentStrip() {
  if (!state.manifest) return;
  const items = recentIds()
    .map((id) => state.manifest.items.find((item) => item.id === id))
    .filter(Boolean)
    .slice(0, 3);
  elements.recentItems.replaceChildren();
  elements.recentStrip.hidden = items.length === 0;
  for (const item of items) {
    const button = document.createElement("button");
    button.className = `recent-item${state.selectedAsset?.id === item.id ? " active" : ""}`;
    button.title = item.name;
    const image = document.createElement("img");
    image.src = resolveAssetUrl(item.thumbnail);
    image.alt = item.name;
    button.appendChild(image);
    button.addEventListener("click", () => selectAsset(item.id));
    elements.recentItems.appendChild(button);
  }
}

function filteredItems() {
  if (!state.manifest) return [];
  const query = elements.searchInput.value.trim().toLocaleLowerCase("zh-CN");
  const category = elements.categorySelect.value;
  const onlyFree = elements.freeOnly.checked;

  return state.manifest.items.filter((item) => {
    if (state.segment === "packs") return false;
    if (state.segment === "similar" && state.selectedAsset && item.category !== state.selectedAsset.category) return false;
    if (category !== "all" && item.category !== category) return false;
    if (onlyFree && !item.isFree) return false;
    if (query) {
      const haystack = [item.name, item.category, ...(item.tags || [])].join(" ").toLocaleLowerCase("zh-CN");
      if (!haystack.includes(query)) return false;
    }
    return true;
  });
}

function renderAssetGrid() {
  const items = filteredItems();
  elements.assetGrid.replaceChildren();
  elements.catalogCount.textContent = `${items.length} 个样机`;
  elements.catalogEmpty.hidden = items.length !== 0;
  if (!items.length) {
    elements.catalogEmpty.querySelector("strong").textContent = state.segment === "packs" ? "套装即将开放" : "没有找到样机";
    elements.catalogEmpty.querySelector("span").textContent = state.segment === "packs" ? "当前版本先验证单个样机流程" : "换个关键词或分类试试";
  }

  for (const item of items) {
    const button = document.createElement("button");
    button.className = `asset-card${state.selectedAsset?.id === item.id ? " active" : ""}`;
    button.dataset.assetId = item.id;

    const image = document.createElement("img");
    image.alt = item.name;
    image.src = resolveAssetUrl(item.thumbnail);
    image.loading = "lazy";

    const footer = document.createElement("footer");
    const name = document.createElement("strong");
    name.textContent = item.name;
    const meta = document.createElement("span");
    meta.textContent = item.isFree ? "免费 · 静态" : "静态";
    footer.append(name, meta);
    button.append(image, footer);
    button.addEventListener("click", () => selectAsset(item.id));
    elements.assetGrid.appendChild(button);
  }
  renderRecentStrip();
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.crossOrigin = "anonymous";
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("样机图片加载失败"));
    image.src = url;
  });
}

async function selectAsset(id) {
  const asset = state.manifest?.items.find((item) => item.id === id);
  if (!asset) return;
  state.selectedAsset = asset;
  rememberRecent(id);
  elements.fitMode.value = asset.screen.defaultFit || "cover";
  elements.assetName.textContent = asset.name;
  elements.assetMeta.textContent = `${asset.canvas.width} × ${asset.canvas.height} · ${asset.isFree ? "免费" : "素材库"}`;
  elements.downloadButton.disabled = true;
  elements.pasteButton.disabled = true;
  state.rendering = true;
  elements.renderingBadge.hidden = false;
  renderAssetGrid();

  try {
    state.baseImage = await loadImage(resolveAssetUrl(asset.layers.base));
    elements.previewCanvas.width = asset.canvas.width;
    elements.previewCanvas.height = asset.canvas.height;
    await renderComposite();
  } catch (error) {
    showToast(error instanceof Error ? error.message : "样机加载失败");
  } finally {
    state.rendering = false;
    elements.renderingBadge.hidden = true;
    elements.downloadButton.disabled = !state.baseImage;
    elements.pasteButton.disabled = !state.baseImage;
  }
}

function quadSize(quad) {
  const distance = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  return {
    width: (distance(quad[0], quad[1]) + distance(quad[3], quad[2])) / 2,
    height: (distance(quad[0], quad[3]) + distance(quad[1], quad[2])) / 2
  };
}

function bilinearPoint(quad, u, v) {
  const topX = quad[0][0] + (quad[1][0] - quad[0][0]) * u;
  const topY = quad[0][1] + (quad[1][1] - quad[0][1]) * u;
  const bottomX = quad[3][0] + (quad[2][0] - quad[3][0]) * u;
  const bottomY = quad[3][1] + (quad[2][1] - quad[3][1]) * u;
  return [topX + (bottomX - topX) * v, topY + (bottomY - topY) * v];
}

function drawMappedTriangle(context, image, source, destination) {
  const [s0, s1, s2] = source;
  const [d0, d1, d2] = destination;
  const denominator = s0[0] * (s1[1] - s2[1]) + s1[0] * (s2[1] - s0[1]) + s2[0] * (s0[1] - s1[1]);
  if (Math.abs(denominator) < 0.00001) return;

  const a = (d0[0] * (s1[1] - s2[1]) + d1[0] * (s2[1] - s0[1]) + d2[0] * (s0[1] - s1[1])) / denominator;
  const c = (d0[0] * (s2[0] - s1[0]) + d1[0] * (s0[0] - s2[0]) + d2[0] * (s1[0] - s0[0])) / denominator;
  const e = (d0[0] * (s1[0] * s2[1] - s2[0] * s1[1]) + d1[0] * (s2[0] * s0[1] - s0[0] * s2[1]) + d2[0] * (s0[0] * s1[1] - s1[0] * s0[1])) / denominator;
  const b = (d0[1] * (s1[1] - s2[1]) + d1[1] * (s2[1] - s0[1]) + d2[1] * (s0[1] - s1[1])) / denominator;
  const d = (d0[1] * (s2[0] - s1[0]) + d1[1] * (s0[0] - s2[0]) + d2[1] * (s1[0] - s0[0])) / denominator;
  const f = (d0[1] * (s1[0] * s2[1] - s2[0] * s1[1]) + d1[1] * (s2[0] * s0[1] - s0[0] * s2[1]) + d2[1] * (s0[0] * s1[1] - s1[0] * s0[1])) / denominator;

  context.save();
  context.beginPath();
  context.moveTo(d0[0], d0[1]);
  context.lineTo(d1[0], d1[1]);
  context.lineTo(d2[0], d2[1]);
  context.closePath();
  context.clip();
  context.setTransform(a, b, c, d, e, f);
  context.drawImage(image, 0, 0);
  context.restore();
}

function insetQuad(quad, sourceAspect, targetAspect) {
  let minU = 0;
  let maxU = 1;
  let minV = 0;
  let maxV = 1;
  if (sourceAspect > targetAspect) {
    const heightRatio = targetAspect / sourceAspect;
    minV = (1 - heightRatio) / 2;
    maxV = 1 - minV;
  } else {
    const widthRatio = sourceAspect / targetAspect;
    minU = (1 - widthRatio) / 2;
    maxU = 1 - minU;
  }
  return [
    bilinearPoint(quad, minU, minV),
    bilinearPoint(quad, maxU, minV),
    bilinearPoint(quad, maxU, maxV),
    bilinearPoint(quad, minU, maxV)
  ];
}

function fillQuad(context, quad, color) {
  context.save();
  context.fillStyle = color;
  context.beginPath();
  context.moveTo(quad[0][0], quad[0][1]);
  for (let index = 1; index < quad.length; index += 1) context.lineTo(quad[index][0], quad[index][1]);
  context.closePath();
  context.fill();
  context.restore();
}

function drawImageToQuad(context, image, originalQuad, fit) {
  const target = quadSize(originalQuad);
  const targetAspect = target.width / target.height;
  const sourceAspect = image.width / image.height;
  let quad = originalQuad;
  let sourceRect = { x: 0, y: 0, width: image.width, height: image.height };

  if (fit === "cover") {
    if (sourceAspect > targetAspect) {
      sourceRect.width = image.height * targetAspect;
      sourceRect.x = (image.width - sourceRect.width) / 2;
    } else {
      sourceRect.height = image.width / targetAspect;
      sourceRect.y = (image.height - sourceRect.height) / 2;
    }
  } else if (fit === "contain") {
    fillQuad(context, originalQuad, "#0d0d0d");
    quad = insetQuad(originalQuad, sourceAspect, targetAspect);
  }

  const columns = 18;
  const rows = 10;
  for (let row = 0; row < rows; row += 1) {
    for (let column = 0; column < columns; column += 1) {
      const u0 = column / columns;
      const u1 = (column + 1) / columns;
      const v0 = row / rows;
      const v1 = (row + 1) / rows;
      const sx0 = sourceRect.x + sourceRect.width * u0;
      const sx1 = sourceRect.x + sourceRect.width * u1;
      const sy0 = sourceRect.y + sourceRect.height * v0;
      const sy1 = sourceRect.y + sourceRect.height * v1;
      const d00 = bilinearPoint(quad, u0, v0);
      const d10 = bilinearPoint(quad, u1, v0);
      const d11 = bilinearPoint(quad, u1, v1);
      const d01 = bilinearPoint(quad, u0, v1);
      drawMappedTriangle(context, image, [[sx0, sy0], [sx1, sy0], [sx1, sy1]], [d00, d10, d11]);
      drawMappedTriangle(context, image, [[sx0, sy0], [sx1, sy1], [sx0, sy1]], [d00, d11, d01]);
    }
  }
}

async function renderComposite() {
  if (!state.selectedAsset || !state.baseImage) return;
  const canvas = elements.previewCanvas;
  const context = canvas.getContext("2d", { alpha: false });
  context.setTransform(1, 0, 0, 1, 0, 0);
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.drawImage(state.baseImage, 0, 0, canvas.width, canvas.height);
  if (state.designImage) {
    drawImageToQuad(context, state.designImage, state.selectedAsset.screen.quad, elements.fitMode.value);
    elements.screenCta.classList.add("has-image");
    elements.screenCta.querySelector("b").textContent = "重新读取选区";
  } else {
    elements.screenCta.classList.remove("has-image");
    elements.screenCta.querySelector("b").textContent = "选择 Figma 画面";
  }
}

function requestSelection() {
  if (!state.selection?.available) {
    showToast(state.selection?.message || "请先在 Figma 画布中选择一个图层");
    return;
  }
  elements.readSelectionButton.disabled = true;
  elements.readSelectionButton.textContent = "读取中";
  postPluginMessage({ type: "request-selection" });
}

function canvasBlob() {
  return new Promise((resolve, reject) => {
    elements.previewCanvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error("无法生成 PNG"));
    }, "image/png");
  });
}

async function downloadRender() {
  try {
    const blob = await canvasBlob();
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = `${state.selectedAsset?.id || "mockup"}.png`;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("PNG 已导出");
  } catch (error) {
    showToast(error instanceof Error ? error.message : "导出失败");
  }
}

async function pasteRender() {
  try {
    elements.pasteButton.disabled = true;
    elements.pasteButton.textContent = "正在粘贴";
    const blob = await canvasBlob();
    const bytes = new Uint8Array(await blob.arrayBuffer());
    postPluginMessage({
      type: "paste-render",
      bytes,
      width: elements.previewCanvas.width,
      height: elements.previewCanvas.height,
      name: `${state.selectedAsset?.name || "样机"} · 样机工作室`
    });
  } catch (error) {
    elements.pasteButton.disabled = false;
    elements.pasteButton.textContent = "粘贴到画布";
    showToast(error instanceof Error ? error.message : "粘贴失败");
  }
}

function updateZoom(delta) {
  state.zoom = Math.max(0.7, Math.min(1.5, state.zoom + delta));
  elements.canvasWrap.style.transform = `scale(${state.zoom})`;
  elements.zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
}

function fitStage() {
  state.zoom = 1;
  elements.canvasWrap.style.transform = "scale(1)";
  elements.zoomLabel.textContent = "适应";
}

function setWindowState(windowState) {
  const collapsed = windowState === "collapsed";
  document.documentElement.classList.toggle("is-collapsed", collapsed);
  elements.collapsedBar.setAttribute("aria-hidden", String(!collapsed));
  postPluginMessage({ type: "set-window-state", state: windowState });
}

function enableWindowResize() {
  let startX = 0;
  let startY = 0;
  let startWidth = 0;
  let startHeight = 0;
  let animationFrame = 0;

  elements.resizeGrip.addEventListener("pointerdown", (event) => {
    startX = event.clientX;
    startY = event.clientY;
    startWidth = window.innerWidth;
    startHeight = window.innerHeight;
    elements.resizeGrip.setPointerCapture(event.pointerId);
  });

  elements.resizeGrip.addEventListener("pointermove", (event) => {
    if (!elements.resizeGrip.hasPointerCapture(event.pointerId)) return;
    cancelAnimationFrame(animationFrame);
    animationFrame = requestAnimationFrame(() => {
      postPluginMessage({
        type: "resize",
        width: startWidth + event.clientX - startX,
        height: startHeight + event.clientY - startY
      });
    });
  });

  elements.resizeGrip.addEventListener("pointerup", (event) => {
    if (elements.resizeGrip.hasPointerCapture(event.pointerId)) {
      elements.resizeGrip.releasePointerCapture(event.pointerId);
    }
  });
}

for (const tab of document.querySelectorAll(".mode-tab")) {
  tab.addEventListener("click", () => {
    if (tab.dataset.mode !== "static") {
      showToast(`${tab.textContent.replace(/开发中|规划中/g, "").trim()}尚未实现；当前只开放真实可用的静态样机`);
      return;
    }
    document.querySelectorAll(".mode-tab").forEach((item) => item.classList.toggle("active", item === tab));
  });
}

for (const segment of document.querySelectorAll(".segment")) {
  segment.addEventListener("click", () => {
    state.segment = segment.dataset.filter;
    document.querySelectorAll(".segment").forEach((item) => item.classList.toggle("active", item === segment));
    renderAssetGrid();
  });
}

elements.refreshButton.addEventListener("click", fetchCatalog);
elements.searchInput.addEventListener("input", renderAssetGrid);
elements.clearSearch.addEventListener("click", () => {
  elements.searchInput.value = "";
  elements.searchInput.focus();
  renderAssetGrid();
});
elements.categorySelect.addEventListener("change", renderAssetGrid);
elements.freeOnly.addEventListener("change", renderAssetGrid);
elements.fitMode.addEventListener("change", renderComposite);
elements.readSelectionButton.addEventListener("click", requestSelection);
elements.screenCta.addEventListener("click", requestSelection);
elements.downloadButton.addEventListener("click", downloadRender);
elements.pasteButton.addEventListener("click", pasteRender);
elements.backgroundToggle.addEventListener("click", () => elements.stage.classList.toggle("light"));
elements.zoomIn.addEventListener("click", () => updateZoom(0.1));
elements.zoomOut.addEventListener("click", () => updateZoom(-0.1));
elements.fitStageButton.addEventListener("click", fitStage);
elements.clearRecent.addEventListener("click", () => {
  safeStorage.removeItem(RECENT_KEY);
  renderRecentStrip();
});
elements.collapseButton.addEventListener("click", () => setWindowState("collapsed"));
elements.expandButton.addEventListener("click", () => setWindowState("expanded"));
elements.menuButton.addEventListener("click", () => showToast(`样机工作室 v${PLUGIN_VERSION} · 远程素材目录`));
document.querySelector("#settingsButton").addEventListener("click", () => showToast("设置将在远程素材链路验证后开放"));
document.querySelector("#aboutButton").addEventListener("click", () => showToast("样机工作室 · 自有素材与渲染引擎"));
enableWindowResize();

window.onmessage = async (event) => {
  const message = event.data.pluginMessage;
  if (!message || typeof message.type !== "string") return;

  if (message.type === "selection-state") {
    state.selection = message.selection;
    elements.selectionText.textContent = message.selection.message;
    elements.selectionChip.classList.toggle("ready", Boolean(message.selection.available));
    elements.readSelectionButton.disabled = !message.selection.available;
    return;
  }

  if (message.type === "catalog-cache") {
    state.pluginCatalogCache = message.cache;
    if (!state.manifest && message.cache) {
      try {
        state.manifest = validateManifest(message.cache.manifest);
        state.catalogBaseUrl = message.cache.catalogBaseUrl;
        setCatalogState("cached", "使用离线目录");
        hydrateCatalog();
      } catch {
        state.pluginCatalogCache = null;
      }
    }
    return;
  }

  if (message.type === "selection-image") {
    elements.readSelectionButton.disabled = false;
    elements.readSelectionButton.textContent = "重新读取";
    if (state.designObjectUrl) URL.revokeObjectURL(state.designObjectUrl);
    state.designObjectUrl = URL.createObjectURL(new Blob([message.bytes], { type: "image/png" }));
    state.designImage = await loadImage(state.designObjectUrl);
    await renderComposite();
    showToast(`已放入：${message.name}`);
    return;
  }

  if (message.type === "selection-error") {
    elements.readSelectionButton.disabled = false;
    elements.readSelectionButton.textContent = "读取选区";
    showToast(message.message);
    return;
  }

  if (message.type === "paste-complete") {
    elements.pasteButton.disabled = false;
    elements.pasteButton.textContent = "粘贴到画布";
    showToast("样机已粘贴到 Figma 画布");
    return;
  }

  if (message.type === "paste-error") {
    elements.pasteButton.disabled = false;
    elements.pasteButton.textContent = "粘贴到画布";
    showToast(message.message);
  }
};

elements.downloadButton.disabled = true;
elements.pasteButton.disabled = true;
postPluginMessage({ type: "ready" });
fetchCatalog();

void PRODUCTION_CATALOG_URL;
</script>
  </body>
</html>
