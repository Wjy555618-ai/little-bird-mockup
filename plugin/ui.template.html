<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>样机工作室</title>
    <style>/*__STYLES__*/</style>
  </head>
  <body>
    <div class="collapsed-bar" id="collapsedBar" aria-hidden="true">
      <div class="collapsed-title">
        <span class="app-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>样机工作室</span>
      </div>
      <button class="window-button expand-button" id="expandButton" aria-label="展开插件">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" /></svg>
        <span>展开</span>
      </button>
    </div>

    <div class="app-shell">
      <header class="modebar">
        <nav class="mode-tabs" aria-label="样机模式">
          <button class="mode-tab active" data-mode="catalog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m6 16 4-4 3 3 2-2 3 3" /></svg>
            <span>样机</span>
          </button>
          <button class="mode-tab" data-mode="adjust">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M12 4v16M19 4v16M3 8h4M10 15h4M17 10h4" /></svg>
            <span>画面调整</span>
          </button>
          <button class="mode-tab" data-mode="perspective">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 14-2 1 15-16 1Z" /><circle cx="5" cy="6" r="1" /><circle cx="19" cy="4" r="1" /><circle cx="20" cy="19" r="1" /><circle cx="4" cy="20" r="1" /></svg>
            <span>透视编辑</span>
          </button>
        </nav>

        <div class="top-actions">
          <button class="window-button" id="refreshButton" aria-label="刷新素材库" title="刷新素材库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5" /><path d="M18.5 10A7 7 0 0 0 6.2 6.4L4 11M5.5 14A7 7 0 0 0 17.8 17.6L20 13" /></svg>
          </button>
          <button class="window-button" id="collapseButton" aria-label="收起插件" title="收起插件">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="catalog-panel">
          <div class="catalog-view" id="catalogView">
            <div class="catalog-segments" role="tablist">
              <button class="segment active" data-filter="all">全部</button>
              <button class="segment" data-filter="similar">相似</button>
            </div>

            <div class="catalog-tools">
              <label class="search-field">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4 4" /></svg>
                <input id="searchInput" type="text" placeholder="搜索样机" autocomplete="off" />
                <button id="clearSearch" aria-label="清空搜索" hidden>×</button>
              </label>
              <div class="filter-row single-filter">
                <label class="category-select">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
                  <select id="categorySelect" aria-label="样机分类">
                    <option value="all">全部分类</option>
                  </select>
                </label>
              </div>
            </div>

            <div class="catalog-summary">
              <span id="catalogCount">0 个样机</span>
              <span class="catalog-state loading" id="catalogState">正在连接</span>
            </div>

            <div class="asset-grid" id="assetGrid" aria-live="polite"></div>

            <div class="catalog-empty" id="catalogEmpty" hidden>
              <strong>没有找到样机</strong>
              <span>换个关键词或刷新素材库</span>
            </div>

            <section class="recent-strip" id="recentStrip" hidden>
              <header><span>最近使用</span><button id="clearRecent" aria-label="清除最近使用">×</button></header>
              <div id="recentItems"></div>
            </section>
          </div>

          <div class="adjust-panel" id="adjustPanel" hidden>
            <header class="panel-heading">
              <strong id="adjustPanelTitle">画面调整</strong>
              <span id="designSourceLabel">尚未读取画面</span>
            </header>

            <div class="selection-card" id="selectionChip" aria-live="polite">
              <span class="selection-dot"></span>
              <span id="selectionText">未选择 Figma 图层</span>
            </div>

            <div class="source-actions">
              <button class="panel-button primary-panel-button" id="readSelectionButton">读取 Figma 选区</button>
              <label class="panel-button file-button">
                导入图片
                <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
              </label>
              <button class="panel-button" id="clearDesignButton" disabled>移除画面</button>
            </div>

            <section class="control-section">
              <label class="select-control">
                <span>填充方式</span>
                <select id="fitMode">
                  <option value="cover">填满</option>
                  <option value="contain">完整显示</option>
                  <option value="stretch">拉伸</option>
                </select>
              </label>
              <label class="range-control"><span>缩放</span><input id="designScale" type="range" min="50" max="200" value="100" /><output id="designScaleValue">100%</output></label>
              <label class="range-control"><span>水平</span><input id="designOffsetX" type="range" min="-100" max="100" value="0" /><output id="designOffsetXValue">0%</output></label>
              <label class="range-control"><span>垂直</span><input id="designOffsetY" type="range" min="-100" max="100" value="0" /><output id="designOffsetYValue">0%</output></label>
              <label class="range-control"><span>旋转</span><input id="designRotation" type="range" min="-30" max="30" value="0" /><output id="designRotationValue">0°</output></label>
            </section>

            <section class="control-section">
              <label class="range-control"><span>亮度</span><input id="designBrightness" type="range" min="50" max="150" value="100" /><output id="designBrightnessValue">100%</output></label>
              <label class="range-control"><span>对比度</span><input id="designContrast" type="range" min="50" max="150" value="100" /><output id="designContrastValue">100%</output></label>
              <label class="range-control"><span>饱和度</span><input id="designSaturation" type="range" min="0" max="200" value="100" /><output id="designSaturationValue">100%</output></label>
            </section>

            <button class="reset-button" id="resetAdjustmentsButton">恢复默认调整</button>
            <button class="reset-button" id="resetPerspectiveButton">恢复样机透视</button>
          </div>
        </aside>

        <section class="stage-panel">
          <div class="stage-toolbar">
            <span class="stage-title" id="stageTitle">预览</span>
            <div class="stage-tools-right">
              <span class="zoom-controls">
                <button class="tool-button" id="zoomOut" title="缩小" aria-label="缩小">−</button>
                <button class="zoom-label" id="zoomReset" title="适应画布">适应</button>
                <button class="tool-button" id="zoomIn" title="放大" aria-label="放大">＋</button>
              </span>
              <button class="color-button" id="backgroundToggle" title="切换舞台背景" aria-label="切换舞台背景"><i></i></button>
            </div>
          </div>

          <div class="stage" id="stage">
            <div class="canvas-wrap" id="canvasWrap">
              <canvas id="previewCanvas" width="1448" height="1086"></canvas>
              <div class="perspective-editor" id="perspectiveEditor" hidden>
                <svg viewBox="0 0 1448 1086" preserveAspectRatio="none" aria-hidden="true"><polygon id="perspectivePolygon" points="" /></svg>
                <button class="perspective-handle" data-corner="0" aria-label="左上角控制点"></button>
                <button class="perspective-handle" data-corner="1" aria-label="右上角控制点"></button>
                <button class="perspective-handle" data-corner="2" aria-label="右下角控制点"></button>
                <button class="perspective-handle" data-corner="3" aria-label="左下角控制点"></button>
              </div>
              <button class="screen-cta" id="screenCta">
                <span>＋</span>
                <b>选择 Figma 画面</b>
              </button>
              <div class="rendering-badge" id="renderingBadge" hidden>正在渲染</div>
            </div>
          </div>

          <footer class="actionbar">
            <div class="asset-meta">
              <strong id="assetName">请选择样机</strong>
              <span id="assetMeta">等待素材目录</span>
            </div>
            <div class="action-buttons">
              <button class="secondary-button" id="downloadButton">导出</button>
              <div class="primary-group">
                <button class="primary-button" id="pasteButton">粘贴到画布</button>
                <span class="resolution-pill">PNG · 原始尺寸</span>
              </div>
            </div>
          </footer>
        </section>
      </main>

      <button class="resize-grip" id="resizeGrip" aria-label="调整窗口大小" title="拖动调整窗口大小"></button>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>

    <span id="versionLabel" hidden>DEV</span>
    <script>/*__RENDERER__*/</script>
    <script>/*__SCRIPT__*/</script>
  </body>
</html>
